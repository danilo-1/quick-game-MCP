<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; display: grid; place-items: center; font-family: system-ui, sans-serif; }
  canvas { max-width: 100vw; max-height: 100vh; border-radius: 6px; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="jogo" width="960" height="540"></canvas>
<script>
// Protótipo gerado pelo quick-game-mcp (modelo: topdown — aventura, roguelike, RPG de ação, sobrevivência).
// Ajuste o jogo mudando os valores de CONFIG.
const CONFIG = Object.assign({
  titulo: "Jogo",
  subtitulo: "",
  objetivo: "Sobreviva às ondas e colete os cristais",
  velocidade: 3.2,
  vida: 5,
  ondas: 5,                 // ondas para vencer
  inimigosPorOnda: 6,       // na primeira onda; cresce a cada onda
  velocidadeInimigo: 1.2,
  cadenciaTiro: 14,         // quadros entre ataques (menor = mais rápido)
  velocidadeTiro: 8,
  invencivel: 60,           // quadros de invencibilidade após levar dano
  corFundo: "#1a1c2c",
  corChao: "#262b44",
  corJogador: "#73eff7",
  corInimigo: "#b13e53",
  corDestaque: "#ffcd75",
  corTexto: "#f4f4f4",
}, __AJUSTES__);

const cv = document.getElementById("jogo"), ctx = cv.getContext("2d");
const teclas = {}, mouse = { x: 480, y: 270, down: false };
addEventListener("keydown", e => { teclas[e.code] = true; if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault(); });
addEventListener("keyup", e => teclas[e.code] = false);
cv.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * 960 / r.width; mouse.y = (e.clientY - r.top) * 540 / r.height; });
cv.addEventListener("mousedown", () => mouse.down = true); addEventListener("mouseup", () => mouse.down = false);

let estado = "titulo", jog, inimigos, tiros, cristais, particulas, onda, pontos, recarga, tremor = 0, pausaSoltar = true, mira = { x: 1, y: 0 };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function reiniciar() {
  jog = { x: 480, y: 270, r: 14, vida: CONFIG.vida, inv: 0 };
  inimigos = []; tiros = []; cristais = []; particulas = []; onda = 0; pontos = 0; recarga = 0;
  proximaOnda(); estado = "jogando";
}
function proximaOnda() {
  onda++; if (onda > CONFIG.ondas) { estado = "vitoria"; return; }
  const n = CONFIG.inimigosPorOnda + (onda - 1) * 3;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    inimigos.push({ x: 480 + Math.cos(a) * 560, y: 270 + Math.sin(a) * 380, r: 12 + Math.random() * 6,
      v: CONFIG.velocidadeInimigo * (0.7 + Math.random() * 0.6) * (1 + onda * 0.08), vida: onda > 2 && Math.random() < 0.3 ? 3 : 1 });
  }
}
function explodir(x, y, cor, n = 10) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = 1 + Math.random() * 3; particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 25, cor }); } }

function atualizar() {
  let dx = (teclas.ArrowRight || teclas.KeyD ? 1 : 0) - (teclas.ArrowLeft || teclas.KeyA ? 1 : 0);
  let dy = (teclas.ArrowDown || teclas.KeyS ? 1 : 0) - (teclas.ArrowUp || teclas.KeyW ? 1 : 0);
  const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
  jog.x = Math.max(jog.r, Math.min(960 - jog.r, jog.x + dx * CONFIG.velocidade));
  jog.y = Math.max(jog.r, Math.min(540 - jog.r, jog.y + dy * CONFIG.velocidade));
  if (dx || dy) mira = { x: dx, y: dy };
  if (mouse.down) { const d = Math.hypot(mouse.x - jog.x, mouse.y - jog.y) || 1; mira = { x: (mouse.x - jog.x) / d, y: (mouse.y - jog.y) / d }; }
  if (recarga > 0) recarga--;
  if ((teclas.Space || mouse.down) && recarga <= 0) {
    tiros.push({ x: jog.x, y: jog.y, vx: mira.x * CONFIG.velocidadeTiro, vy: mira.y * CONFIG.velocidadeTiro, t: 70 });
    recarga = CONFIG.cadenciaTiro;
  }
  for (const t of tiros) { t.x += t.vx; t.y += t.vy; t.t--; }
  for (const i of inimigos) {
    const d = dist(i, jog) || 1; i.x += (jog.x - i.x) / d * i.v; i.y += (jog.y - i.y) / d * i.v;
    for (const t of tiros) if (t.t > 0 && dist(t, i) < i.r + 4) { t.t = 0; i.vida--; i.x -= t.vx * 2; i.y -= t.vy * 2; }
    if (i.vida <= 0 && !i.morto) { i.morto = true; pontos++; explodir(i.x, i.y, CONFIG.corInimigo); if (Math.random() < 0.4) cristais.push({ x: i.x, y: i.y, r: 7 }); tremor = 4; }
    if (!i.morto && jog.inv <= 0 && dist(i, jog) < i.r + jog.r) { jog.vida--; jog.inv = CONFIG.invencivel; tremor = 10; explodir(jog.x, jog.y, CONFIG.corJogador, 16); if (jog.vida <= 0) estado = "derrota"; }
  }
  if (jog.inv > 0) jog.inv--;
  inimigos = inimigos.filter(i => !i.morto); tiros = tiros.filter(t => t.t > 0 && t.x > -20 && t.x < 980 && t.y > -20 && t.y < 560);
  cristais = cristais.filter(c => dist(c, jog) < 26 ? (pontos += 5, explodir(c.x, c.y, CONFIG.corDestaque, 6), false) : true);
  for (const p of particulas) { p.x += p.vx; p.y += p.vy; p.t--; } particulas = particulas.filter(p => p.t > 0);
  if (!inimigos.length && estado === "jogando") proximaOnda();
  if (tremor > 0) tremor--;
}

function texto(t, x, y, tam = 24, cor = CONFIG.corTexto) { ctx.fillStyle = cor; ctx.font = `bold ${tam}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.fillText(t, x, y); }
function circulo(x, y, r, cor) { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

function desenhar() {
  ctx.fillStyle = CONFIG.corFundo; ctx.fillRect(0, 0, 960, 540);
  if (estado === "titulo") {
    texto(CONFIG.titulo, 480, 210, 56); if (CONFIG.subtitulo) texto(CONFIG.subtitulo, 480, 255, 22, CONFIG.corDestaque);
    texto(CONFIG.objetivo, 480, 320, 20); texto("WASD/setas movem · Espaço ou clique ataca · P pausa", 480, 360, 18, CONFIG.corDestaque);
    texto("Pressione Enter para começar", 480, 440, 24, CONFIG.corJogador); return;
  }
  ctx.save(); if (tremor) ctx.translate((Math.random() - 0.5) * tremor, (Math.random() - 0.5) * tremor);
  ctx.fillStyle = CONFIG.corChao; for (let x = 0; x < 960; x += 48) for (let y = 0; y < 540; y += 48) if ((x + y) / 48 % 2) ctx.fillRect(x, y, 48, 48);
  for (const c of cristais) circulo(c.x, c.y, c.r + Math.sin(Date.now() / 150) * 2, CONFIG.corDestaque);
  for (const t of tiros) circulo(t.x, t.y, 4, CONFIG.corDestaque);
  for (const i of inimigos) circulo(i.x, i.y, i.r, i.vida > 1 ? CONFIG.corTexto : CONFIG.corInimigo);
  if (!(jog.inv > 0 && Math.floor(jog.inv / 4) % 2)) { circulo(jog.x, jog.y, jog.r, CONFIG.corJogador); circulo(jog.x + mira.x * 12, jog.y + mira.y * 12, 4, CONFIG.corFundo); }
  for (const p of particulas) { ctx.globalAlpha = p.t / 25; circulo(p.x, p.y, 3, p.cor); } ctx.globalAlpha = 1;
  ctx.restore();
  ctx.textAlign = "left"; ctx.fillStyle = CONFIG.corTexto; ctx.font = "bold 20px system-ui";
  ctx.fillText(`♥ ${"■".repeat(Math.max(0, jog.vida))}   Onda ${Math.min(onda, CONFIG.ondas)}/${CONFIG.ondas}   Pontos ${pontos}`, 16, 30);
  if (estado === "pausa") texto("PAUSA", 480, 270, 48);
  if (estado === "vitoria") { texto("Você sobreviveu!", 480, 240, 56, CONFIG.corDestaque); texto(`Pontos ${pontos} · R para jogar de novo`, 480, 300); }
  if (estado === "derrota") { texto("Fim de jogo", 480, 240, 56, CONFIG.corInimigo); texto(`Chegou à onda ${onda} · R para tentar de novo`, 480, 300); }
}

function loop() {
  if (estado === "titulo" && teclas.Enter) reiniciar();
  if ((estado === "vitoria" || estado === "derrota") && teclas.KeyR) reiniciar();
  if (teclas.KeyP && pausaSoltar && (estado === "jogando" || estado === "pausa")) estado = estado === "pausa" ? "jogando" : "pausa";
  pausaSoltar = !teclas.KeyP;
  if (estado === "jogando") atualizar();
  desenhar(); requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
